<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ObsidianShell - Dynamic Island Terminal</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="island-container" class="state-collapsed">
      <!-- Capa de cristal esmerilado (Frosted Glass backdrop) -->
      <div id="island-backdrop"></div>

      <!-- Vayli Rim Light (Active ambient glow line: 1px-1.5px) -->
      <div id="rim-light" class="rim-light idle"></div>

      <!-- Mode 1: Pill (At Rest: ~260px x 34px) -->
      <header id="notch-pill" class="notch-pill" data-widget="pty_status">
        <div class="pill-left">
          <span class="status-orb" id="status-orb"></span>
          <span class="tty-badge" id="tty-badge">1 TTY</span>
        </div>
        <div class="pill-center" id="pill-title">
          <!-- Widget A: PTY Status -->
          <div class="pill-widget" id="widget-pty">
            <span class="process-name" id="current-process">powershell</span>
          </div>

          <!-- Widget B: Digital Clock -->
          <div class="pill-widget hidden" id="widget-clock">
            <span class="clock-time" id="clock-time">00:00:00</span>
          </div>

          <!-- Widget C: CPU & Memory Metrics -->
          <div class="pill-widget hidden" id="widget-metrics">
            <span class="metric-item" id="pill-cpu">CPU 0%</span>
            <span class="metric-sep">·</span>
            <span class="metric-item" id="pill-ram">RAM 0G</span>
          </div>

          <!-- Widget D: Live Output Log -->
          <div class="pill-widget hidden" id="widget-livelog">
            <span class="livelog-proc" id="pill-log-proc">ps:</span>
            <span class="livelog-snippet" id="pill-log-snippet">Ready</span>
          </div>
        </div>
        <div class="pill-right">
          <div class="activity-pulse" id="activity-pulse"></div>
        </div>
      </header>

      <!-- Mode 2: Glance (Hover/Activity preview: ~420px x 64px) -->
      <section id="notch-glance" class="notch-glance">
        <div class="glance-top">
          <div class="glance-info">
            <span class="status-orb" id="glance-orb"></span>
            <span class="glance-title" id="glance-title">1: powershell</span>
          </div>
          <div class="glance-top-right">
            <span class="glance-status-tag" id="glance-status-tag">EN ESPERA</span>
            <div class="glance-actions hidden" id="glance-actions">
              <button class="glance-btn glance-btn-confirm" id="btn-glance-confirm" title="Enviar Enter al agente">✓ Aceptar</button>
              <button class="glance-btn glance-btn-open" id="btn-glance-open" title="Abrir y enfocar pestaña">↗ Abrir</button>
            </div>
          </div>
        </div>
        <div class="glance-bottom">
          <span class="glance-prompt-icon" id="glance-prompt-icon">&gt;</span>
          <span class="glance-snippet" id="glance-snippet">Terminal lista</span>
        </div>
      </section>

      <!-- Mode 3: Expanded Hub (~850px x 480px) -->
      <main id="notch-body" class="notch-body">
        <nav class="hub-header" id="hub-header">
          <div class="tabs-list" id="tabs-list">
            <!-- Dynamic tab pills rendered here -->
          </div>
          <div class="hub-actions">
            <!-- Version & Update Badge -->
            <button class="version-badge" id="btn-version-badge" title="Buscar actualizaciones">
              <span class="version-dot" id="version-dot"></span>
              <span class="version-text" id="version-text">v0.5.0</span>
            </button>
            <!-- Search in Buffer Button (Ctrl+Shift+F) -->
            <button class="action-btn" id="btn-toggle-search" title="Buscar en buffer (Ctrl+Shift+F)">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </button>
            <!-- Split Vertical (Ctrl+Shift+D) -->
            <button class="action-btn" id="btn-split-vertical" title="Dividir verticalmente (Ctrl+Shift+D)">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <line x1="12" y1="3" x2="12" y2="21"/>
              </svg>
            </button>
            <!-- Split Horizontal (Ctrl+Shift+E) -->
            <button class="action-btn" id="btn-split-horizontal" title="Dividir horizontalmente (Ctrl+Shift+E)">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
              </svg>
            </button>
            <!-- Open Folder / Recent Directories (Ctrl+O) -->
            <button class="action-btn" id="btn-folder-menu" title="Abrir carpeta o recientes (Ctrl+O)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              </svg>
            </button>
            <!-- Quick Shell / Agent Launcher -->
            <button class="action-btn" id="btn-shell-menu" title="Lanzador rápido de shells (Ctrl+Shift+T)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="4 17 10 11 4 5"></polyline>
                <line x1="12" y1="19" x2="20" y2="19"></line>
              </svg>
            </button>
            <!-- Settings Button -->
            <button class="action-btn" id="btn-settings" title="Configuración (Ctrl+,)">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
              </svg>
            </button>
            <!-- Maximize/Fullscreen Button -->
            <button class="action-btn" id="btn-maximize" title="Pantalla completa (F11)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
              </svg>
            </button>
            <button class="action-btn" id="btn-add-tab" title="Nueva terminal (Ctrl+T)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
            <button class="action-btn" id="btn-collapse" title="Colapsar isla (Esc / Alt+Space)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="18 15 12 9 6 15"></polyline>
              </svg>
            </button>
          </div>
        </nav>

        <!-- Floating Buffer Search Bar -->
        <div id="terminal-search-bar" class="terminal-search-bar hidden">
          <input type="text" id="search-input" placeholder="Buscar en buffer..." autocomplete="off" spellcheck="false" />
          <button class="search-btn" id="btn-search-prev" title="Coincidencia anterior (Shift+Enter)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
          </button>
          <button class="search-btn" id="btn-search-next" title="Siguiente coincidencia (Enter)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <button class="search-btn search-close" id="btn-search-close" title="Cerrar búsqueda (Esc)">
            &times;
          </button>
        </div>

        <section id="terminal-viewport" class="terminal-viewport">
          <!-- Active Xterm.js terminal tab containers -->
        </section>

        <!-- Quick Shell Selection & Profile Dropdown -->
        <div id="shell-menu-popover" class="shell-menu-popover hidden">
          <div class="menu-header">Shells y Agentes CLI</div>
          <div class="menu-items">
            <button class="menu-item" data-shell="powershell.exe">
              <span class="menu-item-icon">PS</span>
              <span class="menu-item-name">PowerShell (Windows)</span>
            </button>
            <button class="menu-item" data-shell="cmd.exe">
              <span class="menu-item-icon">CMD</span>
              <span class="menu-item-name">Símbolo del sistema (CMD)</span>
            </button>
            <button class="menu-item" data-shell="wsl.exe">
              <span class="menu-item-icon">WSL</span>
              <span class="menu-item-name">WSL (Subsistema Linux)</span>
            </button>
            <button class="menu-item" data-shell="claude">
              <span class="menu-item-icon orange">AI</span>
              <span class="menu-item-name">Claude Code (CLI)</span>
            </button>
            <button class="menu-item" data-shell="agy">
              <span class="menu-item-icon orange">AGY</span>
              <span class="menu-item-name">Antigravity CLI</span>
            </button>
            <button class="menu-item" data-shell="ollama">
              <span class="menu-item-icon orange">LLM</span>
              <span class="menu-item-name">Ollama Local</span>
            </button>
          </div>

          <!-- Saved Custom Profiles -->
          <div class="menu-header" style="margin-top: 4px;">Perfiles Personalizados</div>
          <div id="custom-profiles-container" class="custom-profiles-container">
            <!-- Dynamically populated from localStorage -->
          </div>

          <div class="profile-creator">
            <div class="profile-input-row">
              <input type="text" id="input-profile-name" placeholder="Nombre..." spellcheck="false" autocomplete="off" />
              <input type="text" id="input-profile-cmd" placeholder="Comando..." spellcheck="false" autocomplete="off" />
            </div>
            <div class="profile-input-row">
              <input type="text" id="input-profile-cwd" placeholder="Directorio de trabajo (CWD)..." spellcheck="false" autocomplete="off" />
              <button id="btn-save-profile" title="Guardar perfil localmente">Guardar</button>
            </div>
          </div>

          <div class="menu-footer">
            <span class="menu-version-text" id="popover-version-text">ObsidianShell v0.5.0</span>
            <button class="menu-update-btn" id="btn-popover-update" title="Buscar actualizaciones">Buscar Actualizaciones</button>
          </div>
        </div>

        <!-- Folder Selection & Recent Directories Popover -->
        <div id="folder-menu-popover" class="folder-menu-popover hidden">
          <div class="menu-header">Directorios y Proyectos</div>
          <div class="menu-items">
            <button class="menu-item folder-browse-item" id="btn-browse-folder">
              <span class="menu-item-icon folder-icon">📁</span>
              <span class="menu-item-name">Abrir carpeta...</span>
              <span class="menu-shortcut-badge">Ctrl+O</span>
            </button>
          </div>

          <div class="menu-header" style="margin-top: 8px;">Carpetas Recientes</div>
          <div id="recent-folders-container" class="recent-folders-container">
            <!-- Dynamically populated from obsidian_settings.recentFolders -->
          </div>
        </div>

              </main>

      <!-- Controladores de Redimensionamiento Manual (Fase 27 y Fase 32) -->
      <div class="resize-handle resize-left" id="resize-left" title="Redimensionar ancho"></div>
      <div class="resize-handle resize-right" id="resize-right" title="Redimensionar ancho"></div>
      <div class="resize-handle resize-bottom" id="resize-bottom" title="Redimensionar alto"></div>
      <div class="resize-handle resize-corner-left" id="resize-corner-left" title="Redimensionar tamaño">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" class="resize-corner-icon">
          <line x1="2" y1="2" x2="2" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="2" y1="5.5" x2="4.5" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="resize-handle resize-corner" id="resize-corner" title="Redimensionar tamaño">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" class="resize-corner-icon">
          <line x1="8" y1="2" x2="2" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="8" y1="5.5" x2="5.5" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
